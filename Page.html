<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Fraud Radar</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, Arial, sans-serif; background: #F4F6FA; color: #0B1F3A; }
.app { max-width: 640px; margin: 0 auto; padding: 16px; }
h1 { margin: 8px 0 0; font-size: 32px; }
.sub { margin: 4px 0 16px; color: #5A6578; }
.card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
label { font-weight: 600; display: block; margin-bottom: 8px; }
textarea { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #CBD3E1; border-radius: 8px; resize: vertical; font-family: inherit; }
.row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
button { font-size: 16px; padding: 10px 18px; border-radius: 8px; border: none; cursor: pointer; }
.primary { background: #1D9A8A; color: #fff; font-weight: 600; }
.primary:disabled { opacity: .5; cursor: not-allowed; }
.ghost { background: #E8ECF3; color: #0B1F3A; }
.score { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
.bar { height: 12px; background: #E8ECF3; border-radius: 6px; overflow: hidden; }
.fill { height: 100%; width: 0; transition: width .5s; }
h2 { font-size: 18px; margin: 0 0 8px; }
ul, ol { padding-left: 20px; margin: 0 0 12px; }
.flag { color: #E63946; font-weight: 600; margin-bottom: 4px; }
.ok { color: #1D9A8A; font-weight: 600; }
.hidden { display: none; }
footer { text-align: center; color: #5A6578; font-size: 13px; margin: 20px 0; }
